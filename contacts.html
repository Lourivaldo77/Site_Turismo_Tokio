<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts | Travel Tokyo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header__container">
            <div class="logo">
                <span class="logo__icon">●</span>
                <span class="logo__text">TRAVEL</span>
            </div>
            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="index.html" class="nav__link">HOME</a></li>
                    <li><a href="about.html" class="nav__link">ABOUT US</a></li>
                    <li><a href="tours.html" class="nav__link">TOURS</a></li>
                    <li><a href="gallery.html" class="nav__link">GALLERY</a></li>
                    <li><a href="reviews.html" class="nav__link">REVIEWS</a></li>
                    <li><a href="contacts.html" class="nav__link nav__link--active">CONTACTS</a></li>
                </ul>
            </nav>
            <div class="header__search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
        </div>
    </header>

    <section class="page-hero">
        <div class="hero__bg-container">
            <img src="https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=1974" alt="Contacts Tokyo" class="hero__bg">
            <div class="hero__overlay"></div>
        </div>
        <div class="container">
            <h1 class="hero__title">CONTACTS</h1>
            <p class="hero__info-text">We are always available to help you plan your trip.</p>
        </div>
    </section>

    <section class="contacts fade-in">
        <div class="container contacts__container">
            <div class="contact-info">
                <h2 class="section-title">GET IN TOUCH</h2>
                <p>Email: info@traveltokyo.com</p>
                <p>Phone: +7 (999) 123-45-67</p>
                <p>Address: 1-2-3 Shibuya, Tokyo</p>
            </div>
            <form class="contact-form">
                <input type="text" placeholder="Your Name" class="contact-form__input">
                <input type="email" placeholder="Email" class="contact-form__input">
                <textarea placeholder="Message" class="contact-form__textarea"></textarea>
                <button type="submit" class="hero__more">SEND →</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 TRAVEL TOKYO. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
