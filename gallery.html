<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея | Travel Tokyo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header__container">
            <div class="logo">
                <span class="logo__icon">●</span>
                <span class="logo__text">TRAVEL</span>
            </div>
            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="index.html" class="nav__link">ГЛАВНАЯ</a></li>
                    <li><a href="about.html" class="nav__link">О НАС</a></li>
                    <li><a href="tours.html" class="nav__link">ТУРЫ</a></li>
                    <li><a href="gallery.html" class="nav__link nav__link--active">ГАЛЕРЕЯ</a></li>
                    <li><a href="reviews.html" class="nav__link">ОТЗЫВЫ</a></li>
                    <li><a href="contacts.html" class="nav__link">КОНТАКТЫ</a></li>
                </ul>
            </nav>
            <div class="header__search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
        </div>
    </header>

    <section class="page-hero">
        <div class="hero__bg-container">
            <img src="https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?q=80&w=2094" alt="Gallery Tokyo" class="hero__bg">
            <div class="hero__overlay"></div>
        </div>
        <div class="container">
            <h1 class="hero__title">ГАЛЕРЕЯ</h1>
            <p class="hero__info-text">Запечатленные моменты из наших путешествий.</p>
        </div>
    </section>

    <section class="gallery fade-in">
        <div class="container">
            <div class="tours__grid">
                <div class="gallery-item-full">
                    <img src="https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=1974" alt="Tokyo 1" class="tour-card__img">
                </div>
                <div class="gallery-item-full">
                    <img src="https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?q=80&w=2094" alt="Tokyo 2" class="tour-card__img">
                </div>
                <div class="gallery-item-full">
                    <img src="https://images.unsplash.com/photo-1502444330042-d1a1ddf9bb5b?q=80&w=2073" alt="Tokyo 3" class="tour-card__img">
                </div>
                <div class="gallery-item-full">
                    <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=2070" alt="Tokyo 4" class="tour-card__img">
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 TRAVEL TOKYO. All rights reserved.</p>
